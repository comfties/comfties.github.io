<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Comfties | アプリのご案内</title>
  <meta name="description" content="Comftiesが提供するアプリのプライバシーポリシーをご案内します。">
  <style>
    :root { color-scheme: light dark; font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f7f8fa; color: #252b30; line-height: 1.75; }
    main { width: min(720px, 100%); margin: 0 auto; padding: 56px 24px 96px; }
    h1 { margin: 8px 0 24px; font-size: clamp(2rem, 6vw, 3rem); letter-spacing: -.035em; }
    p { max-width: 65ch; }
    .brand { color: #59636b; font-size: .9rem; letter-spacing: .12em; }
    .card { margin-top: 32px; padding: 28px; background: #fff; border: 1px solid #dce1e6; border-radius: 20px; }
    .card h2 { margin: 0 0 8px; font-size: 1.35rem; }
    a { color: #263a49; text-decoration-thickness: 1px; text-underline-offset: .2em; }
    a:focus-visible { outline: 3px solid #476f8a; outline-offset: 4px; }
    footer { margin-top: 48px; color: #59636b; font-size: .9rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #15191c; color: #edf0f2; }
      .brand, footer { color: #aeb7be; }
      .card { background: #22282d; border-color: #3e474e; }
      a { color: #b9d4e8; }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">COMFTIES</div>
    <h1>アプリのご案内</h1>
    <p>Comftiesが提供するアプリのプライバシーポリシーを掲載しています。</p>
    <section class="card" aria-labelledby="event-sales-register-title">
      <h2 id="event-sales-register-title">イベント販売レジ</h2>
      <p>即売会やマルシェなどの販売準備、会計、売上・在庫の記録を行うAndroidアプリです。</p>
      <a href="./event-sales-register/privacy/">プライバシーポリシーを読む</a>
    </section>
    <footer>お問い合わせ: <a href="mailto:comfties@gmail.com">comfties@gmail.com</a></footer>
  </main>
</body>
</html>
